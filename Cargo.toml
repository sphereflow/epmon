[package]
name = "epmon"
version = "0.2.0"
authors = ["sphereflow <johannprescher@gmx.de>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "epmon"
test = false
bench = false

[dependencies]
esp-backtrace = { version = "0.16.0", features = [
  "esp32c6",
  "exception-handler",
  "panic-handler",
  "println",
  "colors",
] }
esp-hal = { version = "1.0.0-beta.1", features = ["esp32c6", "unstable"] }
esp32c6 = "0.20"
esp-println = { version = "0.14.0", features = ["esp32c6", "log-04"] }
log = { version = "0.4.25" }
embedded-hal-async = { version = "1" }
embedded-svc = { version = "0.28", default-features = false, features = [] }
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embassy-time = { version = "0.4.0", features = ["generic-queue-8"] }
embassy-executor = { version = "0.7", features = ["nightly"] }
embassy-net = { version = "0.7", features = [
  "tcp",
  "udp",
  "dhcpv4",
  "medium-ethernet",
] }
embassy-sync = "0.7"
esp-hal-embassy = { version = "0.8", features = ["esp32c6", "executors"] }
esp-wifi = { version = "0.14", features = [
  "esp32c6",
  "builtin-scheduler",
  "esp-alloc",
  "wifi",
] }
esp-alloc = "0.8"
heapless = { version = "0.8", default-features = false }
critical-section = "1"
static_cell = { version = "2.1.0", features = ["nightly"] }
smart-leds-trait = "0.3.1"
smart-leds = "0.4"
rmodbus = { version = "0.10", default-features = false, features = [
  "heapless",
] }

# smoltcp = { version = "0.11.0", default-features = false, features = [
#   "medium-ethernet",
#   "proto-dhcpv4",
#   "proto-igmp",
#   "proto-ipv4",
#   "socket-dhcpv4",
#   "socket-icmp",
#   "socket-raw",
#   "socket-tcp",
#   "socket-udp",
# ] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
strip = true
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
